
{% load static %}

<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Título de cada página -->
    <title>{% block title %}VOAD{% endblock %}</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- CSS da VOAD -->
    <link href="{% static 'css/voad.css' %}" rel="stylesheet">

</head>

<body>

    <!-- MENU PRINCIPAL -->
    {% include "partials/_navbar.html" %}


    <main>

        <!-- MENSAGENS DO DJANGO -->
        {% if messages %}

            <div class="container pt-3">

                {% for mensagem in messages %}

                    <div
                        class="alert alert-{% if mensagem.tags == 'error' %}danger{% else %}{{ mensagem.tags }}{% endif %} alert-dismissible fade show"
                        role="alert"
                    >

                        {{ mensagem }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Fechar"
                        ></button>

                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- CONTEÚDO DAS PÁGINAS -->
        {% block content %}
        {% endblock %}

    </main>


    <!-- RODAPÉ -->
    {% include "partials/_footer.html" %}


    <!-- JAVASCRIPT DO BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- SCRIPTS ESPECÍFICOS DE CADA PÁGINA -->
    {% block scripts %}
    {% endblock %}

</body>

</html>
